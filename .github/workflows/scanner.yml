name: Generate scan report

on:
  push:
    branches:
      - "main"
  schedule:
    # Every Monday, at 17:40 UTC
    - cron: "40 17 * * 1"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ministryofjustice/opg-repository-scanner@latest
